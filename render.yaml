services:
  - type: web
    name: agentic-iot-bridge
    runtime: python
    rootDir: bridge
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ESP32_IP
        sync: false
      - key: ESP32_PORT
        value: 80
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false